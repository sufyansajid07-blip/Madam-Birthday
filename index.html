<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Madam ✨</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  overflow:hidden;font-family:Georgia,serif;color:white;
  background:radial-gradient(circle at 50% 20%,#4b255f 0%,#21142f 42%,#0b0815 100%);
}
.stars,.stars:before,.stars:after{content:"";position:absolute;inset:0;background-image:
 radial-gradient(2px 2px at 20% 30%,#fff,transparent),
 radial-gradient(1.5px 1.5px at 70% 20%,#fff,transparent),
 radial-gradient(2px 2px at 85% 65%,#fff,transparent),
 radial-gradient(1px 1px at 35% 75%,#fff,transparent),
 radial-gradient(1.5px 1.5px at 55% 45%,#fff,transparent),
 radial-gradient(1px 1px at 10% 80%,#fff,transparent);
 animation:twinkle 4s infinite alternate;
}
.stars:before{transform:scale(1.4);opacity:.45;animation-delay:1s}
.stars:after{transform:scale(.8);opacity:.35;animation-delay:2s}
@keyframes twinkle{from{opacity:.45}to{opacity:1}}
.card{
 position:relative;z-index:2;width:min(92%,650px);padding:42px 25px 38px;
 text-align:center;border:1px solid rgba(255,255,255,.2);
 border-radius:30px;background:rgba(255,255,255,.09);
 backdrop-filter:blur(15px);box-shadow:0 25px 70px rgba(0,0,0,.45);
}
.small{letter-spacing:5px;text-transform:uppercase;font-size:12px;opacity:.75}
h1{font-size:clamp(40px,10vw,76px);margin:14px 0 8px;
 text-shadow:0 0 30px rgba(255,190,230,.5)}
.subtitle{font-size:18px;opacity:.85;margin-bottom:30px}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.box{padding:17px 5px;border-radius:18px;background:rgba(255,255,255,.1);
 border:1px solid rgba(255,255,255,.12)}
.num{font-family:Arial,sans-serif;font-weight:700;font-size:clamp(27px,7vw,48px)}
.label{font:11px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;opacity:.65;margin-top:5px}
.message{margin-top:28px;font-size:15px;opacity:.7}
.heart{font-size:25px;margin-top:15px;animation:pulse 1.7s infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
.birthday{display:none}
.birthday h2{font-size:clamp(38px,10vw,70px);margin-bottom:12px}
.birthday p{font-size:19px;line-height:1.6}
.confetti{position:fixed;inset:0;pointer-events:none;display:none}
@media(max-width:480px){.card{padding:35px 15px}.countdown{gap:6px}.box{padding:14px 3px}}
</style>
</head>
<body>
<div class="stars"></div>
<div class="card">
  <div class="small">A little surprise for</div>
  <h1>Madam ✨</h1>
  <div class="subtitle">Something special is coming...</div>

  <div id="countdown" class="countdown">
    <div class="box"><div id="days" class="num">00</div><div class="label">Days</div></div>
    <div class="box"><div id="hours" class="num">00</div><div class="label">Hours</div></div>
    <div class="box"><div id="mins" class="num">00</div><div class="label">Minutes</div></div>
    <div class="box"><div id="secs" class="num">00</div><div class="label">Seconds</div></div>
  </div>

  <div id="normal">
    <div class="message">The countdown has officially begun... 🎀</div>
    <div class="heart">♡</div>
  </div>

  <div id="birthday" class="birthday">
    <h2>Happy Birthday, Madam! 🎂✨</h2>
    <p>May your special day be filled with beautiful moments,<br>
    endless smiles and everything that makes you happy. 💖</p>
  </div>
</div>

<script>
const target = new Date("2026-11-28T00:00:00+05:00").getTime();
function update(){
  const now = Date.now(), diff = target-now;
  if(diff<=0){
    document.getElementById("countdown").style.display="none";
    document.getElementById("normal").style.display="none";
    document.getElementById("birthday").style.display="block";
    return;
  }
  const d=Math.floor(diff/86400000);
  const h=Math.floor(diff%86400000/3600000);
  const m=Math.floor(diff%3600000/60000);
  const s=Math.floor(diff%60000/1000);
  document.getElementById("days").textContent=String(d).padStart(2,"0");
  document.getElementById("hours").textContent=String(h).padStart(2,"0");
  document.getElementById("mins").textContent=String(m).padStart(2,"0");
  document.getElementById("secs").textContent=String(s).padStart(2,"0");
}
update(); setInterval(update,1000);
</script>
</body>
</html>
